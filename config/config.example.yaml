# AI Command Center (TeleOps) configuration
# Copy to config/config.yaml and adjust. Secrets stay in .env.

telegram:
  enabled: true

sessions:
  max_concurrent: 8
  heartbeat_interval_seconds: 5
  idle_no_output_seconds: 90   # if a WORKING session goes silent this long, flag it
  reconnect: true
  tmux_prefix: teleops         # tmux session names are prefixed with this

security:
  # Telegram user IDs allowed to use the control center. Everyone else is rejected.
  allowed_users:
    - 000000000
  # Telegram user IDs with admin rights: see ALL sessions/projects/hosts (incl.
  # legacy unowned ones), global server/health/alerts/settings, and may /claim
  # ownership of resources.
  # IMPORTANT: if this key is omitted entirely, every allowed user is treated
  # as an admin (legacy single-owner mode). Set an explicit list — even an
  # empty one — to get real per-user isolation.
  admin_users:
    - 000000000
  # Copy every session notification to admins in addition to the owner.
  # (Non-session events — server alerts etc. — always go to admins only.)
  admin_receive_all_notifications: false
  # Absolute project roots the control center may operate in. Empty = use defaults below.
  project_roots: []

agents:
  qoder:
    enabled: true
    command: qoder
  codex:
    enabled: false
    command: codex
  shell:
    enabled: true
    command: bash

monitor:
  interval_seconds: 30
  cpu_warning: 80
  cpu_critical: 95
  ram_warning: 80
  ram_critical: 90
  disk_warning: 80
  disk_critical: 90
  load_enabled: true

policy:
  # Commands the agent/git layer may run without approval.
  allowed:
    - git status
    - git diff
    - git log
    - git branch
    - npm test
    - pnpm test
    - npm run build
  # Commands that always require user approval.
  approval_required:
    - git push
    - git commit
    - docker compose down
    - systemctl restart
    - rm
    - sudo

notifications:
  # Which events should send a Telegram notification.
  rules:
    APPROVAL_REQUIRED: telegram_notify
    USER_INPUT_REQUIRED: telegram_notify
    COMMAND_FAILED: telegram_notify
    PROCESS_CRASHED: telegram_notify
    SESSION_FINISHED: telegram_notify
    CREDENTIAL_INVALID: telegram_notify
    SERVER_LOW_MEMORY: telegram_notify
    SERVER_HIGH_DISK_USAGE: telegram_notify

# Per-user agent credentials (Qoder). Each user must supply their OWN token;
# a shared server key or shared qoder login is never used as a fallback.
# Tokens are entered through the /qoderkey flow (chat reply, deleted after
# saving by the bot).
credentials:
  # Ask Qoder whether the token actually works BEFORE storing it. Turn this off
  # only if the qoder CLI is unavailable on this host; then credentials are
  # stored unverified.
  validate_pat: true
  pat_validation_timeout_seconds: 25

# Live Session Terminal Mini App (Telegram WebApp, src/web).
webapp:
  # Master switch. Even when true, nothing runs until url is set — the bot
  # then shows the "🖥 Open Session Terminal" button.
  enabled: true
  # The API server speaks plain HTTP; keep it loopback-only and terminate TLS
  # in your reverse proxy (nginx/caddy) which must forward the
  # X-Telegram-Init-Data header unchanged. A non-loopback bind without an
  # https:// url is REFUSED at startup.
  host: 127.0.0.1
  port: 8718
  # Public https:// URL of the Mini App page — the SAME domain you register
  # with @BotFather (/mybots → Bot Settings → Menu Button / web app).
  # Prefer the TELEOPS_WEBAPP_URL env var.
  url: ""
  # Telegram initData older than this is refused (replay protection).
  init_data_max_age_seconds: 3600

# Remote server (SSH) — added at runtime via /addserver; these are connection tuning knobs.
ssh:
  exec_timeout_seconds: 20
  ready_timeout_seconds: 15
  keepalive_seconds: 15

paths:
  secret_key_file: ./data/teleops.key
