# TeleOps — Qoder credential Mini App reverse proxy (TEMPLATE, not applied).
#
# The credential server binds to 127.0.0.1:8717 and must stay private. Telegram
# only opens an HTTPS origin, so this snippet publishes exactly one prefix of it.
#
# Read your current setup before touching anything — port 443 usually already
# belongs to another service:
#
#   sudo nginx -T | grep -n "listen\|server_name\|proxy_pass"   # what exists today
#   sudo ss -tlnp | grep -E ':443|:80'                          # who owns the ports
#   sudo cp -a /etc/nginx /etc/nginx.bak.$(date +%F)            # rollback copy
#
# Preferred integration: add the `location /qoder-key/` block BELOW to the server
# block that already terminates TLS on 443 (a `location` inside an existing
# `server {}` changes no listener and interrupts nothing else — no new `listen`,
# no `default_server`, no firewall change). Only use a standalone server block
# like this one when you have a spare hostname with its own certificate.
#
# Install as a snippet and `include` it, or copy into sites-available and link it:
#   sudo cp deploy/teleops-qoder-minapp.nginx.conf /etc/nginx/snippets/teleops-qoder-minapp.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then tell TeleOps its public address (this is what the bot's button opens):
#   echo 'TELEOPS_MINI_APP_URL=https://teleops.example.com/qoder-key/app' >> .env
# and set in config.yaml:
#   credentials:
#     provision:
#       base_url: https://teleops.example.com   # makes any fallback link https too
#       trust_proxy: true                        # per-IP limits can use XFF from this proxy
#
# Verify: TELEOPS_MINI_APP_URL=https://teleops.example.com/qoder-key/app npm run check:miniapp

server {
    listen 443 ssl;              # NOT default_server: another block owns the default
    listen [::]:443 ssl;
    http2 on;

    server_name teleops.example.com;   # change to YOUR hostname

    # Certificate with a real CA chain — Telegram rejects self-signed certs.
    # Let's Encrypt renews automatically:  sudo certbot --nginx -d teleops.example.com
    ssl_certificate     /etc/letsencrypt/live/teleops.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teleops.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    # The credential form must never be cached by an intermediary.
    add_header Cache-Control "no-store" always;
    server_tokens off;

    # Only the credential prefix is published; nothing else of TeleOps is exposed.
    location /qoder-key/ {
        proxy_pass http://127.0.0.1:8717;   # keep the /qoder-key/ prefix: the page
                                            # and its JSON API live underneath it
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;

        # A PAT is a few hundred bytes; anything larger is not this form.
        client_max_body_size 16k;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;   # covers the optional Qoder token check
        access_log /var/log/nginx/teleops-qoder-key.access.log combined;
        # Do NOT log request bodies: an access log must never see a credential.
    }

    location / {
        return 404;
    }
}

# HTTP is only ever a redirect, never a place a credential can be typed.
server {
    listen 80;
    listen [::]:80;
    server_name teleops.example.com;
    return 301 https://$host$request_uri;
}
